id = teleport
name = Quick-save and return
version = 1.0.0
author = sc-offline
api = 1.1
kind = native
entry = teleport.dll

[settings]
relocation = bool default true label "Allow moving the player (offline only)" help "Off: teleport/travel/bookmark moves answer unavailable. On: moves still need game.relocation (sco-core main e616ed6+ host, offline admission)"
data_root = string default "data" label "Legacy data root"
spawn_file = string default "" label "Legacy quick-save file" help "Empty uses launcher SC_OFFLINE_SPAWN_FILE, then data_root/spawn.txt"
